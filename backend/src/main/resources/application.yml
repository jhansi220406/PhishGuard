server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: PhishGuard

  # Intelligent dual datasource fallback
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:phishguard;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:PhishGuardEnterpriseSecretKeyForCyberDefensePlatformTokenSigning2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  virustotal:
    api-key: ${VIRUSTOTAL_API_KEY:}
  safebrowsing:
    api-key: ${SAFEBROWSING_API_KEY:}

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
